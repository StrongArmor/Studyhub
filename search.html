<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tìm kiếm gia sư</title>
    <link rel="shortcut icon" href="./images/logo.png" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body data-page="search">
    <header>
        <div class="logo"><img src="./images/logo.png" alt="StudyHub logo" /><h2>Study<span class="danger">Hub</span></h2></div>
        <div class="navbar">
            <a href="index.html"><span class="material-icons-sharp">home</span><h3>Home</h3></a>
            <a href="search.html" class="active"><span class="material-icons-sharp">search</span><h3>Tìm kiếm/Lọc</h3></a>
            <a href="tutor.html?id=1"><span class="material-icons-sharp">person</span><h3>Hồ sơ Gia sư</h3></a>
            <a href="bookings.html"><span class="material-icons-sharp">account_balance_wallet</span><h3>Ví</h3></a>
            <a href="#" id="logout-link"><span class="material-icons-sharp">logout</span><h3>Logout</h3></a>
        </div>
        <div class="theme-toggler"><span class="material-icons-sharp active">light_mode</span><span class="material-icons-sharp">dark_mode</span></div>
    </header>
    <main class="demo-page">
        <section class="search-panel">
            <h1>Tìm kiếm &amp; Lọc gia sư</h1>
            <div class="search-filters">
                <input id="keyword" type="text" placeholder="Tìm theo môn học, dạng bài, ví dụ: mạch xoay chiều" />
                <select id="subject"><option value="">Tất cả môn</option><option value="Toán">Toán</option><option value="Lập trình">Lập trình</option><option value="Điện">Điện - Điện tử</option><option value="Database">CSDL / SQL</option></select>
                <select id="price"><option value="">Mức giá</option><option value="low">Dưới 70k/30p</option><option value="mid">70k - 100k/30p</option><option value="high">Trên 100k/30p</option></select>
                <select id="slot"><option value="">Thời gian rảnh</option><option value="30">Ca 30 phút</option><option value="45">Ca 45 phút</option></select>
                <label class="checkbox-line"><input id="flash" type="checkbox" /> Học ngay (online &lt; 5 phút)</label>
            </div>
        </section>
        <section id="search-results" class="tutor-grid"></section>
    </main>
    <script src="app.js"></script>
    <script src="tutor-data.js"></script>
    <script src="tutor-demo.js"></script>
</body>
</html>
